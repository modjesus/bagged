const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const uid = () => Math.random().toString(36).slice(2,9) + now().toString(36).slice(-4);
const feet = h => h.f.toLocaleString();
const ht = h => '<b>' + feet(h) + '</b> ft<s>(' + h.h + ' m)</s>';
const htFlat = h => feet(h) + ' ft (' + h.h + ' m)';
const rec = k => state.bagged[k] || {done:false, date:'', notes:'', photos:[], t:0};
const isBagged = k => !!(state.bagged[k] && state.bagged[k].done);
const livePlans = () => state.plans.filter(p => !p.deleted);
const enabled = () => LISTS.filter(l => state.enabled.includes(l.id));
const hillsIn = id => HILLS.filter(h => h.l.includes(id));
const regionOf = (h, id) => (h.r && h.r[id]) || 'Other';

const MON_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MON_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function dateParts(v){
  const m = /^(\d{4})(?:-(\d{2}))?(?:-(\d{2}))?$/.exec(v || '');
  return m ? {y:m[1]||'', mo:m[2]||'', d:m[3]||''} : {y:'', mo:'', d:''};
}
function composeDate(y, mo, d){ return !y ? '' : !mo ? y : !d ? y+'-'+mo : y+'-'+mo+'-'+d; }
function daysIn(y, mo){ return !mo ? 31 : new Date(Number(y)||2024, Number(mo), 0).getDate(); }
function prettyDate(v){
  const p = dateParts(v);
  if (!p.y) return v || '';
  if (!p.mo) return p.y;
  return (p.d ? Number(p.d)+' ' : '') + (MON_SHORT[Number(p.mo)-1] || p.mo) + ' ' + p.y;
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2800);
}
function sig(s){
  const b = Object.keys(s.bagged).sort().map(k => k + JSON.stringify(s.bagged[k])).join('|');
  const p = [...s.plans].sort((a,c) => a.id < c.id ? -1 : 1).map(x => JSON.stringify(x)).join('|');
  return b + '#' + p + '#' + [...(s.enabled||[])].sort().join(',');
}

/* ---------- local store, with migration from the old two-list keys ---------- */
function migrateKey(oldKey){
  const m = /^([wc]):(.+)$/.exec(oldKey);
  if (!m) return BY_KEY[oldKey] ? oldKey : null;
  const wanted = m[1] === 'w' ? 'wainwright' : 'hewitt-wales';
  const cands = NAME_IDX[m[2].toLowerCase()] || [];
  const hit = cands.find(h => h.l.includes(wanted)) || cands[0];
  return hit ? hit.k : null;
}
function normalise(s){
  const out = {bagged:{}, plans:[], enabled:null};
  for (const [k, v] of Object.entries((s && s.bagged) || {})){
    const nk = migrateKey(k);
    if (!nk) continue;
    const cur = out.bagged[nk];
    const next = {done:!!v.done, date:v.date||'', notes:v.notes||'', photos:Array.isArray(v.photos)?v.photos:[], t:v.t||0};
    out.bagged[nk] = !cur || next.t >= cur.t ? next : cur;
  }
  for (const p of ((s && s.plans) || [])){
    out.plans.push({
      id:p.id||uid(), name:p.name||'', date:p.date||'', notes:p.notes||'',
      hills:(p.hills||[]).map(migrateKey).filter(Boolean),
      deleted:!!p.deleted, t:p.t||0
    });
  }
  if (s && Array.isArray(s.enabled)) out.enabled = s.enabled.filter(id => LIST_BY[id]);
  return out;
}
function loadLocal(){
  for (const k of [KEY, ...OLD_KEYS]){
    try{
      const raw = localStorage.getItem(k);
      if (!raw) continue;
      const s = normalise(JSON.parse(raw));
      return {bagged:s.bagged, plans:s.plans, enabled:s.enabled || ['wainwright','hewitt-wales']};
    }catch(e){}
  }
  return {bagged:{}, plans:[], enabled:['wainwright','hewitt-wales']};
}
function saveLocal(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ toast('This browser is blocking storage — your log may not stick.'); }
}
function touched(){ saveLocal(); scheduleSync(); }
function merge(a, b){
  const out = {bagged:{}, plans:[], enabled:null};
  for (const k of new Set([...Object.keys(a.bagged), ...Object.keys(b.bagged)])){
    const x = a.bagged[k], y = b.bagged[k];
    out.bagged[k] = !x ? y : !y ? x : ((y.t||0) > (x.t||0) ? y : x);
  }
  const m = new Map();
  for (const p of [...a.plans, ...b.plans]){
    const cur = m.get(p.id);
    if (!cur || (p.t||0) > (cur.t||0)) m.set(p.id, p);
  }
  out.plans = [...m.values()];
  out.enabled = b.enabled && b.enabled.length ? b.enabled : (a.enabled || []);
  return out;
}

/* ---------- photo store ---------- */
let dbP;
function db(){
  if (!dbP) dbP = new Promise((res, rej) => {
    let r; try{ r = indexedDB.open('bagged-photos', 1); }catch(e){ return rej(e); }
    r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('p')) r.result.createObjectStore('p'); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbP;
}
function tx(mode, fn){
  return db().then(d => new Promise((res, rej) => {
    const t = d.transaction('p', mode), st = t.objectStore('p');
    let out; try{ out = fn(st); }catch(e){ return rej(e); }
    t.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
    t.onerror = () => rej(t.error);
  }));
}
const putBlob = (k,v) => tx('readwrite', st => st.put(v,k)).catch(()=>null);
const getBlob = k => tx('readonly', st => st.get(k)).catch(()=>null);
const delBlob = k => tx('readwrite', st => st.delete(k)).catch(()=>null);

async function shrink(file){
  const bmp = await createImageBitmap(file, {imageOrientation:'from-image'}).catch(() => createImageBitmap(file));
  const max = 1400, s = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const w = Math.max(1, Math.round(bmp.width*s)), h = Math.max(1, Math.round(bmp.height*s));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').drawImage(bmp, 0, 0, w, h);
  if (bmp.close) bmp.close();
  return await new Promise(r => c.toBlob(r, 'image/jpeg', 0.72));
}
async function addPhotos(key, files){
  let added = 0;
  for (const f of files){
    if (!f || !/^image\//.test(f.type)) continue;
    try{
      const blob = await shrink(f); if (!blob) continue;
      const id = uid(); await putBlob(id, blob);
      const r = rec(key);
      state.bagged[key] = {...r, photos:[...r.photos, {id, up:0}], t:now()};
      added++;
    }catch(e){}
  }
  if (added){ touched(); render(); toast(added + (added===1 ? ' photo added.' : ' photos added.')); }
  else toast('Could not read that image.');
}
async function removePhoto(key, id){
  const r = rec(key);
  state.bagged[key] = {...r, photos:r.photos.filter(p => p.id !== id), t:now()};
  await delBlob(id);
  const u = blobUrls.get(id); if (u){ URL.revokeObjectURL(u); blobUrls.delete(id); }
  touched(); render();
}
async function photoSrc(p){
  if (blobUrls.has(p.id)) return blobUrls.get(p.id);
  let b = await getBlob(p.id);
  if (!(b instanceof Blob) && p.up){
    if (backend === 'firebase' && fbUser) b = await fbGetPhoto(p.id);
    else if (backend === 'github' && GH) b = await ghGetPhoto(p.id);
    if (b instanceof Blob) await putBlob(p.id, b);
  }
  if (b instanceof Blob){ const u = URL.createObjectURL(b); blobUrls.set(p.id, u); return u; }
  return '';
}
async function hydratePhotos(){
  for (const img of document.querySelectorAll('img[data-pid]')){
    if (img.dataset.done) continue;
    const src = await photoSrc({id:img.dataset.pid, up:img.dataset.up === '1'});
    if (src){ img.src = src; img.dataset.done = '1'; }
  }
}

/* ---------- GitHub sync ---------- */
const GH_KEY = 'bagged.gh';
let GH = null;
let logSha = null;
let syncErr = '';

function ghLoad(){
  try{
    const c = JSON.parse(localStorage.getItem(GH_KEY));
    if (c && c.owner && c.repo && c.token) return Object.assign({branch:'main'}, c);
  }catch(e){}
  return null;
}
function ghStore(cfg){ try{ localStorage.setItem(GH_KEY, JSON.stringify(cfg)); }catch(e){} }

const b64ToStr = b64 =>
  new TextDecoder().decode(Uint8Array.from(atob(String(b64).replace(/\s/g,'')), c => c.charCodeAt(0)));
function strToB64(s){
  const bytes = new TextEncoder().encode(s);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000)
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function blobToB64(blob){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1] || '');
    r.onerror = () => rej(r.error || new Error('read failed'));
    r.readAsDataURL(blob);
  });
}

function ghHeaders(extra){
  return Object.assign({
    'Authorization': 'Bearer ' + GH.token,
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28'
  }, extra || {});
}
const ghUrl = path =>
  'https://api.github.com/repos/' + encodeURIComponent(GH.owner) + '/' +
  encodeURIComponent(GH.repo) + '/contents/' + path;

function ghGet(path, accept){
  return fetch(ghUrl(path) + '?ref=' + encodeURIComponent(GH.branch) + '&t=' + now(),
    {headers: ghHeaders(accept ? {'Accept': accept} : null), cache:'no-store'});
}
function ghPut(path, contentB64, sha, message){
  const body = {message:message, content:contentB64, branch:GH.branch};
  if (sha) body.sha = sha;
  return fetch(ghUrl(path), {
    method:'PUT',
    headers: ghHeaders({'Content-Type':'application/json'}),
    body: JSON.stringify(body)
  });
}
function httpMsg(s){
  if (s === 401) return 'token rejected';
  if (s === 403) return 'no permission (check the token grants Contents write)';
  if (s === 404) return 'repository not found';
  if (s === 409) return 'someone else saved first';
  if (s === 422) return 'GitHub rejected the write';
  return 'GitHub error ' + s;
}

async function ghCheck(cfg){
  let r;
  try{
    r = await fetch('https://api.github.com/repos/' + encodeURIComponent(cfg.owner) + '/' + encodeURIComponent(cfg.repo), {
      headers:{'Authorization':'Bearer ' + cfg.token, 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'}
    });
  }catch(e){ return {ok:false, msg:'Could not reach GitHub. Are you online?'}; }
  if (r.ok){
    const j = await r.json();
    return {ok:true, priv:!!j.private, branch:j.default_branch || 'main', full:j.full_name};
  }
  if (r.status === 401) return {ok:false, msg:'That token was rejected — check you pasted the whole thing.'};
  if (r.status === 403) return {ok:false, msg:'GitHub refused. The token may not cover this repository.'};
  if (r.status === 404) return {ok:false, msg:'No repository of that name the token can see. Check the owner and the name.'};
  return {ok:false, msg:'GitHub returned ' + r.status + '.'};
}

async function pullLog(){
  const r = await ghGet(LOG_PATH);
  if (r.status === 404){ logSha = null; return null; }
  if (!r.ok) throw new Error(httpMsg(r.status));
  const j = await r.json();
  logSha = j.sha;
  return normalise(JSON.parse(b64ToStr(j.content)));
}
async function ghGetPhoto(id){
  try{
    const r = await ghGet('photos/' + id + '.jpg', 'application/vnd.github.raw');
    if (!r.ok) return null;
    return await r.blob();
  }catch(e){ return null; }
}

async function initSync(){
  GH = ghLoad();
  cloudReady = true;
  cloudWritable = !!GH;
  if (!GH){ syncState = 'local'; render(); return; }
  syncState = 'saving'; paintSync();
  try{
    const remote = await pullLog();
    if (remote){ state = merge(state, remote); saveLocal(); cloudSig = sig(remote); lastSynced = now(); }
    else cloudSig = '';
    syncState = sig(state) === cloudSig ? 'synced' : 'pending';
    syncErr = '';
  }catch(e){
    syncErr = String((e && e.message) || e);
    syncState = 'error';
  }
  render();
  if (syncState === 'pending') scheduleSync(1200);
}

let syncTimer = null;

let syncing = false;
async function ghSyncNow(){
  if (!GH || syncing) return;
  clearTimeout(syncTimer);
  syncing = true; syncState = 'saving'; paintSync();
  try{
    // pull first so two devices converge rather than clobber
    const remote = await pullLog();
    if (remote) state = merge(state, remote);

    const pending = [];
    for (const r of Object.values(state.bagged))
      for (const p of (r.photos || [])) if (!p.up) pending.push(p);
    for (const p of pending.slice(0, 4)){
      const blob = await getBlob(p.id);
      if (!(blob instanceof Blob)){ p.up = 1; continue; }
      const res = await ghPut('photos/' + p.id + '.jpg', await blobToB64(blob), null, 'Add photo');
      if (res.ok || res.status === 422) p.up = 1;
      else if (res.status !== 409) throw new Error(httpMsg(res.status));
    }

    let res = await ghPut(LOG_PATH, strToB64(JSON.stringify(state)), logSha, 'Update log');
    if (res.status === 409 || res.status === 422){
      const again = await pullLog();
      if (again) state = merge(state, again);
      res = await ghPut(LOG_PATH, strToB64(JSON.stringify(state)), logSha, 'Update log');
    }
    if (!res.ok) throw new Error(httpMsg(res.status));
    const j = await res.json();
    logSha = (j && j.content && j.content.sha) || logSha;

    cloudSig = sig(state);
    lastSynced = now();
    syncState = 'synced';
    syncErr = '';
    saveLocal();
    if (pending.length > 4) scheduleSync(1500);
  }catch(e){
    syncErr = String((e && e.message) || e);
    syncState = 'error';
    clearTimeout(syncTimer);
    syncTimer = setTimeout(ghSyncNow, 25000);
  }
  syncing = false;
  render();
}



/* ---------- setup panel ---------- */
function renderGhBox(){
  const box = document.getElementById('ghBox');
  if (!box) return;
  if (GH){
    box.innerHTML =
      '<p>Syncing with <b>' + esc(GH.owner) + '/' + esc(GH.repo) + '</b> on branch <b>' + esc(GH.branch) + '</b>.' +
      (syncErr ? ' <span style="color:var(--warn)">Last attempt: ' + esc(syncErr) + '</span>' : '') + '</p>' +
      '<div class="btnrow"><button class="btn" id="ghSyncNow">Sync now</button>' +
      '<button class="btn danger" id="ghForget">Disconnect this device</button></div>';
    document.getElementById('ghSyncNow').onclick = () => { ghSyncNow(); toast('Syncing…'); };
    document.getElementById('ghForget').onclick = () => {
      localStorage.removeItem(GH_KEY);
      GH = null; logSha = null; cloudWritable = false; syncState = 'local'; syncErr = '';
      renderGhBox(); render(); toast('Disconnected. Your log stays on this device.');
    };
    return;
  }
  box.innerHTML =
    '<p>Connect the private repository that holds your log. Do this once on each device you use.</p>' +
    '<div class="form" style="margin-top:8px; border-color:var(--line)">' +
    '<div><label for="ghOwner">GitHub username</label><input id="ghOwner" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="your-username"></div>' +
    '<div><label for="ghRepo">Private repository name</label><input id="ghRepo" autocapitalize="off" autocorrect="off" spellcheck="false" value="bagged-log"></div>' +
    '<div><label for="ghToken">Access token</label><input id="ghToken" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="github_pat_…"></div>' +
    '<p id="ghMsg" style="font-size:13px; margin:0"></p>' +
    '<div class="btnrow" style="margin-top:0"><button class="btn" id="ghConnect">Connect</button></div>' +
    '</div>';
  document.getElementById('ghConnect').onclick = async () => {
    const msg = document.getElementById('ghMsg');
    const cfg = {
      owner: document.getElementById('ghOwner').value.trim(),
      repo: document.getElementById('ghRepo').value.trim(),
      token: document.getElementById('ghToken').value.trim(),
      branch: 'main'
    };
    if (!cfg.owner || !cfg.repo || !cfg.token){ msg.textContent = 'Fill in all three fields.'; msg.style.color = 'var(--warn)'; return; }
    msg.textContent = 'Checking…'; msg.style.color = 'var(--ink-3)';
    const r = await ghCheck(cfg);
    if (!r.ok){ msg.textContent = r.msg; msg.style.color = 'var(--warn)'; return; }
    cfg.branch = r.branch;
    if (!r.priv){
      msg.textContent = 'Careful — that repository is public, so your log would be readable by anyone. Use a private one.';
      msg.style.color = 'var(--warn)';
      return;
    }
    ghStore(cfg); GH = cfg; cloudWritable = true; syncErr = '';
    msg.textContent = 'Connected.'; msg.style.color = 'var(--done)';
    renderGhBox();
    await initSync();
    hydratePhotos();
    toast('Connected — syncing now.');
  };
}



/* ---------- mutations ---------- */
function applyDate(el, value){
  if (el.dataset.plan){ if (ui.draft) ui.draft.date = value; render(); return; }
  const k = el.dataset.k; if (!k) return;
  const c = rec(k);
  state.bagged[k] = {...c, done: c.done || !!value, date:value, t:now()};
  touched(); render();
}
function setBagged(key, on, date){
  const c = rec(key);
  state.bagged[key] = {...c, done:on, date: on ? (date || c.date || today()) : c.date, t:now()};
  touched(); render();
}
function toggleList(id){
  const i = state.enabled.indexOf(id);
  if (i >= 0){
    if (state.enabled.length === 1){ toast('Keep at least one list switched on.'); return; }
    state.enabled.splice(i, 1);
    if (ui.list === id) ui.list = state.enabled[0];
  } else {
    state.enabled.push(id);
    ui.list = id;
  }
  touched(); renderListToggles(); render();
  if (mapReady) drawMarkers();
}

/* ---------- stats ---------- */
function statsFor(id){
  const items = hillsIn(id);
  const done = items.filter(h => isBagged(h.k));
  const highest = done.reduce((a,b) => (!a || b.h > a.h) ? b : a, null);
  const regions = (DATA.order[id] || []).map(g => {
    const inG = items.filter(h => regionOf(h, id) === g);
    return {g, total:inG.length, done:inG.filter(h => isBagged(h.k)).length};
  }).filter(x => x.total);
  return {total:items.length, done:done.length, remaining:items.length - done.length, highest, regions, items};
}

/* ---------- date fields ---------- */
function dateFields(value, attrs){
  const p = dateParts(value);
  const yNow = new Date().getFullYear();
  const dim = daysIn(p.y, p.mo);
  let s = '<div class="dategroup">';
  s += '<select class="dsel dd" data-act="dpart" data-part="d" ' + attrs + ' aria-label="Day"><option value="">Day</option>';
  for (let i = 1; i <= dim; i++){ const v = String(i).padStart(2,'0'); s += '<option value="'+v+'"'+(p.d===v?' selected':'')+'>'+i+'</option>'; }
  s += '</select>';
  s += '<select class="dsel dm" data-act="dpart" data-part="m" ' + attrs + ' aria-label="Month"><option value="">Month</option>';
  for (let i = 1; i <= 12; i++){ const v = String(i).padStart(2,'0'); s += '<option value="'+v+'"'+(p.mo===v?' selected':'')+'>'+MON_LONG[i-1]+'</option>'; }
  s += '</select>';
  s += '<select class="dsel dy" data-act="dpart" data-part="y" ' + attrs + ' aria-label="Year"><option value="">Year</option>';
  for (let y = yNow + 1; y >= 1950; y--) s += '<option value="'+y+'"'+(p.y===String(y)?' selected':'')+'>'+y+'</option>';
  s += '</select>';
  s += '<button class="btn quiet dtoday" data-act="dtoday" ' + attrs + '>Today</button>';
  return s + '</div>';
}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
  const allDone = new Set(Object.keys(state.bagged).filter(isBagged));
  let tot = 0, dn = 0;
  for (const l of enabled()){ const s = statsFor(l.id); tot += s.total; dn += s.done; }
  document.getElementById('tn-h').textContent = dn + '/' + tot;
  document.getElementById('tn-m').textContent = tot + ' hills';
  const planCount = livePlans().filter(p => !p.hills.length || !p.hills.every(k => isBagged(k))).length;
  document.getElementById('tn-p').textContent = planCount === 0 ? 'none yet' : planCount + ' planned';

  let banner = '';
  if (cloudReady && !cloudOn() && !ui.bannerHidden){
    banner = '<div class="banner"><div><b>Not syncing yet</b>Your log is safe on this device. To have it follow you between phone and desktop — or to let a friend keep their own — set up syncing from the pill above.</div><button data-act="hidebanner" aria-label="Dismiss">×</button></div>';
  } else if (cloudOn() && syncState === 'error' && !ui.bannerHidden){
    banner = '<div class="banner"><div><b>Could not save to the cloud</b>' + esc(syncErr) + '. Everything is still safe on this device and it will keep retrying.</div><button data-act="hidebanner" aria-label="Dismiss">×</button></div>';
  }

  const ft = document.getElementById('tabFriends');
  if (ft) ft.hidden = !(backend === 'firebase' && fbConfigured());
  if (tab === 'f' && ft && ft.hidden) tab = 'h';
  document.getElementById('tn-f').textContent = board && board.length ? board.length + ' walkers' : '—';
  document.getElementById('main').innerHTML = banner +
    (tab === 'p' ? renderPlans() : tab === 'm' ? renderMapTab() : tab === 'f' ? renderBoard() : renderHills());
  if (tab === 'f' && board === null && fbUser) fbLoadBoard().then(render);
  paintSync(); wire(); hydratePhotos();
  if (tab === 'm') mountMap();
}

function listBar(){
  let s = '<div class="listbar">';
  for (const l of enabled()){
    const st = statsFor(l.id);
    s += '<button class="lchip" data-act="pick-list" data-v="' + l.id + '" aria-pressed="' + (ui.list===l.id) + '">' +
         esc(l.name) + '<b>' + st.done + '/' + st.total + '</b></button>';
  }
  s += '<button class="lchip add" data-act="open-lists">＋ Lists</button></div>';
  return s;
}

function renderHills(){
  if (!state.enabled.length) return '<p class="empty">No lists switched on. Tap ＋ Lists to choose some.</p>';
  if (!state.enabled.includes(ui.list)) ui.list = state.enabled[0];
  const id = ui.list, L = LIST_BY[id], s = statsFor(id);
  const pct = s.done ? Math.max(1, Math.round(s.done/s.total*100)) : 0;
  const isW = id === 'wainwright';

  let html = listBar();
  html += '<section class="summary">';
  html += '<div class="sumhead"><div class="bignum">' + s.done + ' <span>/ ' + s.total + '</span></div>';
  html += '<div class="sumlabel">' + esc(L.where) + '<br>' + pct + '% bagged</div></div>';
  html += '<div class="bar"><i style="width:' + pct + '%"></i></div>';
  html += '<div class="meta"><span><b>' + s.remaining + '</b> to go</span>';
  if (s.highest) html += '<span>highest bagged: <b>' + esc(s.highest.n) + '</b> ' + feet(s.highest) + ' ft</span>';
  html += '</div>';
  html += '<button class="disclose" data-act="breakdown"><span>Progress by ' + (isW ? 'book' : 'area') + '</span><span>' + (ui.breakdown ? 'Hide ▲' : 'Show ▼') + '</span></button>';
  if (ui.breakdown){
    html += '<div class="breakdown">';
    for (const b of s.regions){
      const p = b.done ? Math.max(1, Math.round(b.done/b.total*100)) : 0;
      html += '<div class="brow"><div><div class="bname">' +
        (isW && BOOK_VAR[b.g] ? '<i class="swatch" style="background:var(' + BOOK_VAR[b.g] + ')"></i>' : '') +
        esc(b.g) + '</div><i class="bbar"><s style="width:' + p + '%"></s></i></div>' +
        '<div class="bcount">' + b.done + '/' + b.total + '</div></div>';
    }
    html += '</div>';
  }
  html += '</section>';

  html += '<div class="controls"><div class="field">';
  html += '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5" stroke-linecap="round"/></svg>';
  html += '<input type="search" id="q" placeholder="Search a hill…" value="' + esc(ui.q) + '" autocomplete="off"></div>';
  html += '<div class="seg" role="group">';
  for (const [v,lab] of [['all','All'],['todo','To do'],['done','Bagged']])
    html += '<button data-act="status" data-v="' + v + '" aria-pressed="' + (ui.status===v) + '">' + lab + '</button>';
  html += '<button data-act="sort" data-v="' + (ui.sort==='height'?'az':'height') + '" style="margin-left:auto">' + (ui.sort==='height'?'↕ Height':'↕ A–Z') + '</button>';
  html += '</div>';
  html += '<div class="chips"><button class="chip" data-act="region" data-v="" aria-pressed="' + (ui.region==='') + '">All areas</button>';
  for (const b of s.regions) html += '<button class="chip" data-act="region" data-v="' + esc(b.g) + '" aria-pressed="' + (ui.region===b.g) + '">' + esc(b.g.replace('The ','')) + '</button>';
  html += '</div></div>';

  const q = norm(ui.q);
  const items = s.items.filter(h => {
    if (ui.region && regionOf(h, id) !== ui.region) return false;
    if (ui.status === 'done' && !isBagged(h.k)) return false;
    if (ui.status === 'todo' && isBagged(h.k)) return false;
    if (q && !(norm(h.n).includes(q) || norm(h.w).includes(q))) return false;
    return true;
  });
  if (!items.length) return html + '<p class="empty">No hills match that. Try clearing the search or filters.</p>';

  for (const b of s.regions){
    const inG = items.filter(h => regionOf(h, id) === b.g);
    if (!inG.length) continue;
    inG.sort((x,y) => ui.sort === 'height' ? y.h - x.h : x.n.localeCompare(y.n));
    const d = inG.filter(h => isBagged(h.k)).length;
    const gp = d ? Math.max(1, Math.round(d/inG.length*100)) : 0;
    html += '<div class="grouphead"><div class="gt"><h2>' +
      (isW && BOOK_VAR[b.g] ? '<i class="swatch" style="background:var(' + BOOK_VAR[b.g] + ')"></i>' : '') +
      esc(b.g) + '</h2><span>' + d + '/' + inG.length + ' · ' + gp + '%</span></div>';
    html += '<i class="gbar"><i style="width:' + gp + '%"></i></i></div><ul class="hills">';
    for (const h of inG) html += hillRow(h, id);
    html += '</ul>';
  }
  return html;
}

function hillRow(h, listId){
  const on = isBagged(h.k), r = rec(h.k), open = ui.open === h.k;
  const bookVar = listId === 'wainwright' ? BOOK_VAR[regionOf(h, 'wainwright')] : null;
  let s = '<li class="hill' + (on ? ' on' : '') + (bookVar ? ' bk' : '') + '"' +
          (bookVar ? ' style="--bkc:var(' + bookVar + ')"' : '') + '>';
  s += '<div class="hrow">';
  s += '<button class="tick" data-act="tick" data-k="' + esc(h.k) + '" aria-pressed="' + on + '" aria-label="Mark ' + esc(h.n) + ' bagged">' + ICON_CHECK + '</button>';
  s += '<button class="hmain" data-act="open" data-k="' + esc(h.k) + '" aria-expanded="' + open + '">';
  s += '<span class="hname">' + esc(h.n) + '</span>';
  const bits = [];
  if (h.w && h.w !== h.n) bits.push('<span class="wel">' + esc(h.w) + '</span>');
  if (on && r.date) bits.push(prettyDate(r.date));
  if (r.notes) bits.push('note');
  if (bits.length) s += '<span class="hsub">' + bits.join(' · ') + '</span>';
  const others = h.l.filter(x => x !== listId && state.enabled.includes(x));
  if (others.length) s += '<span class="tags">' + others.map(x => '<span class="tag">' + esc(LIST_BY[x].name.replace('Hewitts of ','')) + '</span>').join('') + '</span>';
  s += '</button>';
  if (r.photos.length){
    const p = r.photos[0];
    s += '<img class="thumb" data-pid="' + esc(p.id) + '" data-up="' + (p.up?1:0) + '" alt="Photo of ' + esc(h.n) + '">';
  }
  s += '<span class="hh">' + ht(h) + '</span></div>';
  if (open){
    s += '<div class="detail">';
    s += '<div><label>Date climbed</label>' + dateFields(r.date, 'data-k="' + esc(h.k) + '"');
    if (!r.date) s += '<p class="dhint">Only remember the year? Set the year and leave the rest — it ticks the hill either way.</p>';
    else if (!dateParts(r.date).d) s += '<p class="dhint">Logged as ' + esc(prettyDate(r.date)) + ' — day is optional.</p>';
    s += '</div>';
    if (!on) s += '<div><button class="btn" data-act="tick" data-k="' + esc(h.k) + '">Bag it</button></div>';
    s += '<div><label for="nt-' + esc(h.k) + '">Notes</label><textarea id="nt-' + esc(h.k) + '" data-act="notes" data-k="' + esc(h.k) + '" placeholder="Route, weather, who with…">' + esc(r.notes||'') + '</textarea></div>';
    s += '<div><label>Photos</label><div class="shots">';
    for (const p of r.photos)
      s += '<button class="shot' + (p.up ? '' : ' up0') + '" data-act="viewphoto" data-k="' + esc(h.k) + '" data-p="' + esc(p.id) + '"><img data-pid="' + esc(p.id) + '" data-up="' + (p.up?1:0) + '" alt=""></button>';
    s += '<label class="addshot">+ Photo<input type="file" accept="image/*" multiple data-act="photo" data-k="' + esc(h.k) + '" hidden></label>';
    s += '</div></div>';
    s += '<div><label>On these lists</label><div class="tags">' + h.l.map(x => '<span class="tag">' + esc(LIST_BY[x].name) + '</span>').join('') + '</div></div>';
    s += '</div>';
  }
  return s + '</li>';
}

/* ---------- map ---------- */
let map = null, mapReady = false, markerLayer = null, mapWarned = false;
function renderMapTab(){
  let html = listBar();
  html += '<div class="controls" style="margin-bottom:0"><div class="seg" role="group">';
  html += '<button data-act="mapscope" data-v="enabled" aria-pressed="' + (ui.mapScope==='enabled') + '">All my lists</button>';
  html += '<button data-act="mapscope" data-v="one" aria-pressed="' + (ui.mapScope==='one') + '">' + esc(LIST_BY[ui.list].name) + ' only</button>';
  html += '</div></div>';
  html += '<div id="mapbox"></div>';
  html += '<div class="maplegend"><span><i class="done"></i>Bagged</span><span><i></i>Still to do</span><span>Dot size follows height</span></div>';
  html += '<p class="mapnote">Terrain, contours and paths from OpenTopoMap. The map needs a connection — everything else in the app works offline.</p>';
  return html;
}
function mapHills(){
  const ids = ui.mapScope === 'one' ? [ui.list] : state.enabled;
  return HILLS.filter(h => h.l.some(x => ids.includes(x)));
}
function mountMap(){
  const box = document.getElementById('mapbox');
  if (!box) return;
  if (typeof L === 'undefined'){
    box.innerHTML = '<p class="empty">The map library could not load. It needs a connection the first time — try again when you have signal.</p>';
    return;
  }
  if (map && map._container !== box){ map.remove(); map = null; mapReady = false; }
  if (!map){
    map = L.map(box, {preferCanvas:true, zoomControl:true, attributionControl:true});
    L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
      maxZoom:17, minZoom:5,
      attribution:'Map data: © <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> contributors, SRTM | Style: © <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA)'
    }).addTo(map);
    markerLayer = L.layerGroup().addTo(map);
    mapReady = true;
    drawMarkers(true);
  } else {
    setTimeout(() => map.invalidateSize(), 60);
    drawMarkers();
  }
}
function drawMarkers(fit){
  if (!mapReady || !markerLayer) return;
  markerLayer.clearLayers();
  const list = mapHills();
  const cs = getComputedStyle(document.documentElement);
  const done = cs.getPropertyValue('--done').trim() || '#3C7852';
  const todo = cs.getPropertyValue('--ink-3').trim() || '#868D80';
  for (const h of list){
    const on = isBagged(h.k);
    const m = L.circleMarker([h.a, h.o], {
      radius: 3 + Math.min(6, (h.h - 250) / 190),
      color: on ? done : todo,
      weight: on ? 1 : 1.6,
      fillColor: done,
      fillOpacity: on ? 1 : 0,
      bubblingMouseEvents: false
    });
    m.on('click', () => openPopup(m, h));
    markerLayer.addLayer(m);
  }
  if (fit && list.length){
    const b = L.latLngBounds(list.map(h => [h.a, h.o]));
    map.fitBounds(b, {padding:[24,24]});
  }
}
function openPopup(m, h){
  const on = isBagged(h.k), r = rec(h.k);
  const shot = r.photos && r.photos[0];
  const html = (shot ? '<img class="popshot" data-pid="' + esc(shot.id) + '" data-up="' + (shot.up?1:0) + '" alt="">' : '') +
    '<b>' + esc(h.n) + '</b><span class="pm">' + htFlat(h) + ' · ' +
    esc(h.l.map(x => LIST_BY[x].name).join(', ')) + (on && r.date ? ' · ' + prettyDate(r.date) : '') + '</span>' +
    '<button class="popbtn' + (on ? ' off' : '') + '" data-act="tick" data-k="' + esc(h.k) + '">' +
    (on ? 'Bagged — tap to undo' : 'Bag it') + '</button>';
  m.bindPopup(html).openPopup();
  hydratePhotos();
}


/* ---------- routes ---------- */
function renderPlans(){
  let html = '<div class="planintro"><strong>Plan a day out.</strong> Build a route from any hills on any of your lists, add the date you are aiming for and your notes. When you get back, tick them off here and the date carries across to your log.</div>';
  html += '<div class="btnrow"><button class="btn' + (ui.planForm ? ' quiet' : '') + '" data-act="newplan">' + (ui.planForm ? 'Cancel' : '+ Plan a new route') + '</button></div>';

  if (ui.planForm){
    const d = ui.draft;
    html += '<div class="form">';
    html += '<div><label for="pn">Route name</label><input id="pn" data-act="pfield" data-f="name" value="' + esc(d.name) + '" placeholder="e.g. Fairfield Horseshoe"></div>';
    html += '<div><label>Target date</label>' + dateFields(d.date, 'data-plan="1"') + '</div>';
    html += '<div><label for="po">Notes</label><textarea id="po" data-act="pfield" data-f="notes" placeholder="Parking, distance, escape routes, who is coming…">' + esc(d.notes) + '</textarea></div>';
    html += '<div><label>Hills on this route (' + d.hills.length + ')</label>';
    if (d.hills.length){
      html += '<div class="picked">';
      for (const k of d.hills){
        const h = BY_KEY[k]; if (!h) continue;
        html += '<span class="pill">' + esc(h.n) + '<button data-act="unpick" data-k="' + esc(k) + '" aria-label="Remove">×</button></span>';
      }
      html += '</div>';
    }
    html += '<div class="field" style="margin-top:8px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5" stroke-linecap="round"/></svg><input id="pq" placeholder="Search any hill to add…" value="' + esc(ui.planQ) + '" autocomplete="off"></div>';
    const pq = norm(ui.planQ);
    if (pq){
      const matches = HILLS.filter(h => !d.hills.includes(h.k) && (norm(h.n).includes(pq) || norm(h.w).includes(pq))).slice(0, 40);
      html += '<div class="results" style="margin-top:6px">';
      if (!matches.length) html += '<p class="empty" style="padding:14px">Nothing matches “' + esc(ui.planQ) + '”.</p>';
      for (const h of matches) html += '<button data-act="pick" data-k="' + esc(h.k) + '">' + esc(h.n) + '<span>' + feet(h) + ' ft · ' + esc(regionOf(h, h.l[0])) + '</span></button>';
      html += '</div>';
    }
    html += '</div><div class="btnrow"><button class="btn" data-act="saveplan">Save route</button></div></div>';
  }

  const plans = livePlans();
  if (!plans.length && !ui.planForm) return html + '<p class="empty">No routes planned yet. Sketch one out above — it will wait here until you go.</p>';

  const sorted = [...plans].sort((a,b) => {
    const ad = a.hills.length && a.hills.every(k => isBagged(k));
    const bd = b.hills.length && b.hills.every(k => isBagged(k));
    if (ad !== bd) return ad ? 1 : -1;
    return (a.date || '9999').localeCompare(b.date || '9999');
  });
  for (const p of sorted){
    const hs = p.hills.map(k => BY_KEY[k]).filter(Boolean);
    const done = hs.filter(h => isBagged(h.k)).length;
    const allDone = hs.length > 0 && done === hs.length;
    const climbM = hs.reduce((a,h) => a + h.h, 0), climbF = hs.reduce((a,h) => a + h.f, 0);
    html += '<article class="plan' + (allDone ? ' done' : '') + '">';
    html += '<div class="planhead"><h3>' + esc(p.name || 'Untitled route') + '</h3><button class="linkbtn" data-act="delplan" data-id="' + esc(p.id) + '">Delete</button></div>';
    html += '<div class="planmeta">';
    if (p.date) html += '<span>' + prettyDate(p.date) + '</span>';
    html += '<span>' + hs.length + ' hill' + (hs.length===1?'':'s') + '</span>';
    if (hs.length) html += '<span>' + climbF.toLocaleString() + ' ft (' + climbM.toLocaleString() + ' m) of summits</span>';
    html += '</div>';
    if (p.notes) html += '<p class="plannotes">' + esc(p.notes) + '</p>';
    if (hs.length){
      html += '<ul class="planhills">';
      for (const h of hs){
        const on = isBagged(h.k);
        html += '<li class="' + (on ? 'on' : '') + '"><button class="tick" data-act="tick" data-k="' + esc(h.k) + '" data-date="' + esc(p.date||'') + '" aria-pressed="' + on + '" aria-label="Mark ' + esc(h.n) + ' bagged">' + ICON_CHECK + '</button>';
        const pr = rec(h.k), ps = pr.photos && pr.photos[0];
        if (ps) html += '<img class="thumb sm" data-pid="' + esc(ps.id) + '" data-up="' + (ps.up?1:0) + '" alt="">';
        html += '<span class="nm">' + esc(h.n) + '</span><span class="hh"><b>' + feet(h) + '</b> ft</span></li>';
      }
      html += '</ul><div class="planstat"><i style="width:' + Math.round(done/hs.length*100) + '%"></i></div><div class="btnrow">';
      html += allDone ? '<span class="planmeta" style="align-self:center">Route complete</span>'
                      : '<button class="btn ghost" data-act="bagall" data-id="' + esc(p.id) + '">Bag all ' + hs.length + '</button>';
      html += '</div>';
    }
    html += '</article>';
  }
  return html;
}

/* ---------- events ---------- */
function wire(){
  const keep = (id, prop) => {
    const el = document.getElementById(id); if (!el) return;
    el.oninput = e => {
      ui[prop] = e.target.value;
      const pos = e.target.selectionStart;
      render();
      const n = document.getElementById(id);
      if (n){ n.focus(); try{ n.setSelectionRange(pos, pos); }catch(err){} }
    };
  };
  keep('q','q'); keep('pq','planQ');
}

document.addEventListener('click', e => {
  const tabBtn = e.target.closest('.tab');
  if (tabBtn){ tab = tabBtn.dataset.tab; ui.q=''; ui.region=''; ui.open=null; render(); window.scrollTo({top:0}); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act;

  if (a === 'tick'){
    setBagged(el.dataset.k, !isBagged(el.dataset.k), el.dataset.date || '');
    if (mapReady){ drawMarkers(); if (map) map.closePopup(); }
  }
  else if (a === 'open'){ ui.open = ui.open === el.dataset.k ? null : el.dataset.k; render(); }
  else if (a === 'breakdown'){ ui.breakdown = !ui.breakdown; render(); }
  else if (a === 'status'){ ui.status = el.dataset.v; render(); }
  else if (a === 'sort'){ ui.sort = el.dataset.v; render(); }
  else if (a === 'region'){ ui.region = el.dataset.v; render(); }
  else if (a === 'pick-list'){ ui.list = el.dataset.v; ui.region=''; ui.q=''; render(); if (mapReady && ui.mapScope==='one') drawMarkers(true); }
  else if (a === 'open-lists'){ openSheet(); setTimeout(() => { const t = document.getElementById('listToggles'); if (t) t.scrollIntoView({block:'center'}); }, 60); }
  else if (a === 'mapscope'){ ui.mapScope = el.dataset.v; render(); if (mapReady) drawMarkers(true); }
  else if (a === 'togglelist'){ toggleList(el.dataset.v); }
  else if (a === 'viewphoto') openViewer(el.dataset.k, el.dataset.p);
  else if (a === 'dtoday') applyDate(el, today());
  else if (a === 'hidebanner'){ ui.bannerHidden = true; render(); }
  else if (a === 'backend'){ setBackend(el.dataset.v); }
  else if (a === 'toggleshare'){ fbShare = !fbShare; fbPrefsDirty = true; board = null; renderAccountBox(); scheduleSync(400); }
  else if (a === 'refreshboard'){ board = null; render(); fbLoadBoard().then(render); }
  else if (a === 'newplan'){
    ui.planForm = !ui.planForm;
    ui.draft = ui.planForm ? {name:'', date:'', notes:'', hills:[]} : null;
    ui.planQ = ''; render();
  }
  else if (a === 'pick'){ ui.draft.hills.push(el.dataset.k); ui.planQ=''; render(); }
  else if (a === 'unpick'){ ui.draft.hills = ui.draft.hills.filter(x => x !== el.dataset.k); render(); }
  else if (a === 'saveplan'){
    const d = ui.draft;
    if (!d.name.trim() && !d.hills.length){ toast('Give the route a name or add a hill first.'); return; }
    state.plans.push({id:'p'+uid(), name:d.name.trim(), date:d.date, notes:d.notes.trim(), hills:d.hills, deleted:false, t:now()});
    ui.planForm = false; ui.draft = null; ui.planQ = '';
    touched(); render(); toast('Route saved.');
  }
  else if (a === 'delplan'){
    const p = state.plans.find(x => x.id === el.dataset.id);
    if (p){ p.deleted = true; p.t = now(); }
    touched(); render(); toast('Route deleted.');
  }
  else if (a === 'bagall'){
    const p = state.plans.find(x => x.id === el.dataset.id); if (!p) return;
    const d = p.date || today();
    p.hills.forEach(k => { if (!isBagged(k)){ const c = rec(k); state.bagged[k] = {...c, done:true, date:c.date || d, t:now()}; } });
    touched(); render(); toast('All bagged. Nice one.');
  }
});

document.addEventListener('change', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a === 'dpart'){
    const grp = el.closest('.dategroup');
    const val = part => { const s = grp.querySelector('select[data-part="'+part+'"]'); return s ? s.value : ''; };
    let y = val('y'), mo = val('m'), dd = val('d');
    if (dd && Number(dd) > daysIn(y, mo)) dd = String(daysIn(y, mo)).padStart(2,'0');
    applyDate(el, composeDate(y, mo, dd));
  }
  else if (a === 'pfield' && ui.draft){ ui.draft[el.dataset.f] = el.value; }
  else if (a === 'photo' && el.files && el.files.length){
    const files = [...el.files]; el.value = '';
    toast('Processing…'); addPhotos(el.dataset.k, files);
  }
});

document.addEventListener('input', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.dataset.act === 'notes'){
    const c = rec(el.dataset.k);
    state.bagged[el.dataset.k] = {...c, notes:el.value, t:now()};
    touched();
  }
  if (el.dataset.act === 'pfield' && ui.draft) ui.draft[el.dataset.f] = el.value;
});

/* ---------- photo viewer ---------- */
let viewing = null;
const viewer = document.getElementById('viewer');
async function openViewer(key, id){
  const h = BY_KEY[key]; if (!h) return;
  viewing = {key, id};
  const p = (rec(key).photos || []).find(x => x.id === id) || {id};
  document.getElementById('vimg').src = await photoSrc(p) || '';
  const r = rec(key);
  document.getElementById('vcap').textContent = h.n + (r.date ? ' · ' + prettyDate(r.date) : '');
  viewer.classList.add('open');
}
document.getElementById('vclose').onclick = () => { viewer.classList.remove('open'); viewing = null; };
document.getElementById('vdel').onclick = () => {
  if (!viewing) return;
  const v = viewing; viewer.classList.remove('open'); viewing = null;
  removePhoto(v.key, v.id); toast('Photo deleted.');
};

/* ---------- list toggles ---------- */
function renderListToggles(){
  const box = document.getElementById('listToggles'); if (!box) return;
  box.innerHTML = LISTS.map(l => {
    const on = state.enabled.includes(l.id);
    const s = statsFor(l.id);
    return '<div class="togglerow"><div class="tinfo"><b>' + esc(l.name) + '</b>' +
      '<span>' + esc(l.where) + ' · ' + l.count + ' hills' + (s.done ? ' · ' + s.done + ' bagged' : '') + '</span></div>' +
      '<button class="sw" data-act="togglelist" data-v="' + l.id + '" aria-pressed="' + on + '" aria-label="' + esc(l.name) + '"></button></div>';
  }).join('');
}

/* ---------- sheet ---------- */
const sheet = document.getElementById('sheet');
function openSheet(){
  document.getElementById('backupText').value = JSON.stringify(state);
  document.getElementById('diag').textContent = 'sync — ' + diagLine();
  document.getElementById('cloudNote').textContent = cloudOn()
    ? 'Synced, and kept on this device too, so it works with no signal.'
    : 'Saved in this browser only. Choose how to sync below.';
  renderListToggles(); renderAccountBox();
  sheet.classList.add('open');
}
document.getElementById('menuBtn').onclick = openSheet;
document.getElementById('closeSheet').onclick = () => sheet.classList.remove('open');
sheet.onclick = e => { if (e.target === sheet) sheet.classList.remove('open'); };
document.getElementById('syncBtn').onclick = () => { if (!cloudOn()) openSheet(); else syncNow(); };
document.getElementById('copyBtn').onclick = async () => {
  const ta = document.getElementById('backupText');
  try{ await navigator.clipboard.writeText(ta.value); toast('Backup copied.'); }
  catch(err){ ta.select(); toast('Press copy on your keyboard — the text is selected.'); }
};
document.getElementById('restoreBtn').onclick = () => {
  try{
    const s = JSON.parse(document.getElementById('backupText').value);
    if (!s || typeof s !== 'object' || !('bagged' in s)) throw new Error('bad');
    const inc = normalise(s);
    for (const v of Object.values(inc.bagged)) v.t = now();
    for (const p of inc.plans) p.t = now();
    const m = merge(state, {bagged:inc.bagged, plans:inc.plans, enabled:inc.enabled});
    state = {bagged:m.bagged, plans:m.plans, enabled:(m.enabled && m.enabled.length) ? m.enabled : state.enabled};
    touched(); render(); sheet.classList.remove('open'); toast('Log restored.');
  }catch(err){ toast('That does not look like a Bagged backup.'); }
};

/* ---------- boot ---------- */
function syncTopH(){
  const h = document.querySelector('.top');
  if (h) document.documentElement.style.setProperty('--topH', h.offsetHeight + 'px');
}
window.addEventListener('resize', syncTopH);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(syncTopH);
syncTopH();
window.addEventListener('online', () => { if (cloudOn() && syncState !== 'synced') syncNow(); });
setInterval(paintSync, 60000);

if ('serviceWorker' in navigator)
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));


/* ---------- Firebase accounts ---------- */
const FB_V = '12.18.0';
let FB = null;            // the loaded SDK functions
let fbApp = null, fbAuth = null, fbDb = null;
let fbUser = null;        // {uid, name, photo}
let fbReady = false;      // SDK loaded (or definitively not)
let fbShare = false;      // opted in to the leaderboard
let fbPrefsDirty = false; // local prefs changed and not yet pushed
let fbName = '';
let board = null;         // cached leaderboard rows

const fbConfigured = () => {
  const c = window.FIREBASE_CONFIG;
  return !!(c && c.apiKey && c.projectId);
};

function loadFirebase(){
  return new Promise(resolve => {
    if (!fbConfigured()) return resolve(null);
    if (window.__fb) return resolve(window.__fb);
    const s = document.createElement('script');
    s.type = 'module';
    s.textContent =
      "import { initializeApp } from 'https://www.gstatic.com/firebasejs/" + FB_V + "/firebase-app.js';" +
      "import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut } from 'https://www.gstatic.com/firebasejs/" + FB_V + "/firebase-auth.js';" +
      "import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs, query, orderBy, limit } from 'https://www.gstatic.com/firebasejs/" + FB_V + "/firebase-firestore.js';" +
      "window.__fb = { initializeApp, getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut, getFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs, query, orderBy, limit };" +
      "window.dispatchEvent(new Event('fb-ready'));";
    s.onerror = () => resolve(null);
    window.addEventListener('fb-ready', () => resolve(window.__fb), {once:true});
    document.head.appendChild(s);
    setTimeout(() => resolve(window.__fb || null), 12000);
  });
}

async function fbStart(){
  FB = await loadFirebase();
  fbReady = true;
  if (!FB) return;
  try{
    fbApp = FB.initializeApp(window.FIREBASE_CONFIG);
    fbAuth = FB.getAuth(fbApp);
    fbDb = FB.getFirestore(fbApp);
  }catch(e){ FB = null; return; }
  try{ await FB.getRedirectResult(fbAuth); }catch(e){}
  FB.onAuthStateChanged(fbAuth, async u => {
    fbUser = u ? {uid:u.uid, name:u.displayName || 'Walker', photo:u.photoURL || ''} : null;
    if (fbUser && backend === 'firebase'){
      fbName = fbName || fbUser.name;
      await fbSync(true);
    }
    renderAccountBox(); render();
  });
}

async function fbSignIn(){
  if (!FB || !fbAuth) return;
  const prov = new FB.GoogleAuthProvider();
  try{
    await FB.signInWithPopup(fbAuth, prov);
  }catch(e){
    const c = (e && e.code) || '';
    if (/popup-blocked|popup-closed|cancelled-popup|operation-not-supported/.test(c)){
      try{ await FB.signInWithRedirect(fbAuth, prov); }
      catch(e2){ toast('Could not open the Google sign-in window.'); }
    } else if (/unauthorized-domain/.test(c)){
      toast('This web address is not authorised in your Firebase project yet.');
    } else if (!/cancelled|closed/.test(c)){
      toast('Sign-in failed: ' + c.replace('auth/',''));
    }
  }
}
async function fbSignOut(){
  if (FB && fbAuth) await FB.signOut(fbAuth);
  fbUser = null; board = null;
  renderAccountBox(); render();
}

const userRef = () => FB.doc(fbDb, 'users', fbUser.uid);
const photoRef = id => FB.doc(fbDb, 'users', fbUser.uid, 'photos', id);
const boardRef = uid => FB.doc(fbDb, 'leaderboard', uid);

async function fbPull(){
  const snap = await FB.getDoc(userRef());
  if (!snap.exists()) return null;
  const d = snap.data() || {};
  if (!fbPrefsDirty){
    if (typeof d.share === 'boolean') fbShare = d.share;
    if (d.name) fbName = d.name;
  }
  if (Array.isArray(d.enabled) && d.enabled.length) state.enabled = d.enabled.filter(x => LIST_BY[x]);
  try{ return normalise(JSON.parse(d.log || '{}')); }catch(e){ return null; }
}
async function fbPush(){
  const payload = JSON.stringify({bagged:state.bagged, plans:state.plans});
  if (payload.length > 900000) throw new Error('log too large for one record');
  await FB.setDoc(userRef(), {
    log: payload, name: fbName || (fbUser && fbUser.name) || 'Walker',
    share: !!fbShare, enabled: state.enabled, updatedAt: Date.now()
  });
}
async function fbGetPhoto(id){
  try{
    const s = await FB.getDoc(photoRef(id));
    if (!s.exists()) return null;
    const d = s.data();
    if (!d || !d.d) return null;
    const bin = atob(d.d);
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    return new Blob([bytes], {type:'image/jpeg'});
  }catch(e){ return null; }
}
async function fbPutPhoto(id, blob){
  const b64 = await blobToB64(blob);
  if (b64.length > 950000) throw new Error('photo too large');
  await FB.setDoc(photoRef(id), {d:b64, t:Date.now()});
}
async function fbPushBoard(){
  if (!fbUser) return;
  if (!fbShare){ try{ await FB.deleteDoc(boardRef(fbUser.uid)); }catch(e){} return; }
  const counts = {};
  let total = 0;
  for (const l of LISTS){
    const n = hillsIn(l.id).filter(h => isBagged(h.k)).length;
    if (n){ counts[l.id] = n; total += n; }
  }
  await FB.setDoc(boardRef(fbUser.uid), {
    name: fbName || fbUser.name, counts, total,
    hills: Object.keys(state.bagged).filter(isBagged).length,
    updatedAt: Date.now()
  });
}
async function fbLoadBoard(){
  if (!FB || !fbUser) return [];
  try{
    const q = FB.query(FB.collection(fbDb, 'leaderboard'), FB.orderBy('hills','desc'), FB.limit(50));
    const snap = await FB.getDocs(q);
    const rows = [];
    snap.forEach(d => rows.push(Object.assign({uid:d.id}, d.data())));
    board = rows;
    return rows;
  }catch(e){ board = []; return []; }
}

let fbSyncing = false;
async function fbSync(initial){
  if (!FB || !fbUser || fbSyncing) return;
  fbSyncing = true;
  syncState = 'saving'; paintSync();
  try{
    const remote = await fbPull();
    if (remote) state = merge(state, {bagged:remote.bagged, plans:remote.plans, enabled:state.enabled});

    const pending = [];
    for (const r of Object.values(state.bagged))
      for (const p of (r.photos || [])) if (!p.up) pending.push(p);
    for (const p of pending.slice(0, 4)){
      const blob = await getBlob(p.id);
      if (!(blob instanceof Blob)){ p.up = 1; continue; }
      try{ await fbPutPhoto(p.id, blob); p.up = 1; }
      catch(e){ /* leave for next pass */ }
    }

    await fbPush();
    await fbPushBoard();
    fbPrefsDirty = false;
    cloudSig = sig(state); lastSynced = now(); syncState = 'synced'; syncErr = '';
    saveLocal();
    if (pending.length > 4) scheduleSync(1500);
  }catch(e){
    syncErr = String((e && e.message) || e);
    syncState = 'error';
    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => fbSync(), 25000);
  }
  fbSyncing = false;
  render();
}


/* ---------- backend switch ---------- */
const BACKEND_KEY = 'bagged.backend';
let backend = (() => { try{ return localStorage.getItem(BACKEND_KEY) || ''; }catch(e){ return ''; } })();
function setBackend(b){
  backend = b;
  try{ b ? localStorage.setItem(BACKEND_KEY, b) : localStorage.removeItem(BACKEND_KEY); }catch(e){}
  syncState = 'local'; syncErr = ''; cloudSig = '';
  renderAccountBox(); render();
  if (b === 'github' && GH) initSync();
  if (b === 'firebase' && fbUser) fbSync(true);
}
const cloudOn = () => (backend === 'github' && !!GH) || (backend === 'firebase' && !!fbUser);

/* route every save through whichever backend is chosen */
function scheduleSync(delay){
  if (!cloudOn()) return;
  syncState = 'pending'; paintSync();
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncNow, delay || 3500);
}
function syncNow(){
  if (backend === 'firebase') return fbSync();
  if (backend === 'github') return ghSyncNow();
  return Promise.resolve();
}

function paintSync(){
  const b = document.getElementById('syncBtn'), t = document.getElementById('syncTxt');
  if (!b) return;
  b.dataset.s = syncState;
  const mins = lastSynced ? Math.floor((now() - lastSynced) / 60000) : -1;
  t.textContent =
    syncState === 'saving'  ? 'Saving…' :
    syncState === 'pending' ? 'Save now' :
    syncState === 'error'   ? 'Retry' :
    syncState === 'synced'  ? (mins < 1 ? 'Saved' : mins < 60 ? 'Saved ' + mins + 'm ago' : 'Saved') :
    'Set up sync';
  b.title = backend === 'firebase' && fbUser ? 'Signed in as ' + (fbName || fbUser.name)
          : backend === 'github' && GH ? 'Syncing with ' + GH.owner + '/' + GH.repo
          : 'Tap to set up syncing across your devices';
}
function diagLine(){
  if (backend === 'firebase') return 'accounts · ' + (fbConfigured() ? (FB ? (fbUser ? 'signed in' : 'signed out') : 'sdk unavailable') : 'not configured') + (syncErr ? ' · ' + syncErr : '');
  if (backend === 'github') return GH ? GH.owner + '/' + GH.repo + (syncErr ? ' · ' + syncErr : ' · ok') : 'no repository connected';
  return 'no sync chosen';
}

/* ---------- account panel ---------- */
function renderAccountBox(){
  const box = document.getElementById('accountBox');
  if (!box) return;
  let s = '<div class="seg" style="margin-bottom:12px">';
  for (const [v, lab] of [['', 'This device only'], ['firebase', 'Account'], ['github', 'GitHub repo']])
    s += '<button data-act="backend" data-v="' + v + '" aria-pressed="' + (backend === v) + '">' + lab + '</button>';
  s += '</div>';

  if (backend === 'firebase'){
    if (!fbConfigured()){
      s += '<p>Accounts are not switched on for this copy of the app. Whoever set it up needs to paste a Firebase config into <code>firebase-config.js</code>.</p>';
    } else if (!fbReady){
      s += '<p>Connecting…</p>';
    } else if (!FB){
      s += '<p>Could not reach the sign-in service. It needs a connection the first time.</p>';
    } else if (!fbUser){
      s += '<p>Sign in and your log follows you to any device — and to any friend you send the link to, each with their own.</p>' +
           '<div class="btnrow"><button class="btn" id="fbIn">Sign in with Google</button></div>';
    } else {
      s += '<p>Signed in as <b>' + esc(fbUser.name) + '</b>.</p>';
      s += '<div><label for="fbNameIn">Name others see on the leaderboard</label>' +
           '<input id="fbNameIn" value="' + esc(fbName || fbUser.name) + '" maxlength="40"></div>';
      s += '<div class="togglerow" style="margin-top:10px"><div class="tinfo"><b>Show me on the leaderboard</b>' +
           '<span>Shares your name and how many hills you have bagged per list. Dates, notes and photos are never shared.</span></div>' +
           '<button class="sw" data-act="toggleshare" aria-pressed="' + (!!fbShare) + '" aria-label="Share on leaderboard"></button></div>';
      s += '<div class="btnrow"><button class="btn" id="fbSyncNow">Sync now</button>' +
           '<button class="btn quiet" id="fbOut">Sign out</button></div>';
    }
  } else if (backend === 'github'){
    s += '<div id="ghBox"></div>';
  } else {
    s += '<p>Your log stays in this browser. Nothing leaves the device, and nothing syncs.</p>';
  }
  box.innerHTML = s;

  if (backend === 'github') renderGhBox();
  const bIn = document.getElementById('fbIn'); if (bIn) bIn.onclick = fbSignIn;
  const bOut = document.getElementById('fbOut'); if (bOut) bOut.onclick = fbSignOut;
  const bNow = document.getElementById('fbSyncNow'); if (bNow) bNow.onclick = () => { fbSync(); toast('Syncing…'); };
  const nm = document.getElementById('fbNameIn');
  if (nm) nm.onchange = () => { fbName = nm.value.trim().slice(0,40) || fbUser.name; fbPrefsDirty = true; scheduleSync(400); };
}

/* ---------- leaderboard ---------- */
function renderBoard(){
  if (backend !== 'firebase' || !fbConfigured())
    return '<p class="empty">Switch on accounts under ⋮ → Sync to compare with friends.</p>';
  if (!fbUser)
    return '<p class="empty">Sign in under ⋮ → Sync, and anyone you share the link with gets their own log — with an optional leaderboard.</p>';

  let html = '<div class="planintro"><strong>Who has bagged what.</strong> Only people who have opted in appear here, and only their totals — never dates, notes or photos. Switch yourself on or off under ⋮ → Sync.</div>';
  html += '<div class="btnrow"><button class="btn quiet" data-act="refreshboard">Refresh</button></div>';
  if (board === null) return html + '<p class="empty">Loading…</p>';
  if (!board.length) return html + '<p class="empty">Nobody has opted in yet. Be the first — or send a friend the link.</p>';

  const shown = state.enabled;
  html += '<div style="margin-top:12px">';
  board.forEach((row, i) => {
    const me = fbUser && row.uid === fbUser.uid;
    html += '<article class="plan" style="margin-top:8px' + (me ? ';border-color:var(--accent)' : '') + '">';
    html += '<div class="planhead"><h3>' + (i+1) + '. ' + esc(row.name || 'Walker') + (me ? ' <span class="tag">you</span>' : '') + '</h3>';
    html += '<span class="hh"><b>' + (row.hills || 0).toLocaleString() + '</b><s>hills</s></span></div>';
    const cs = row.counts || {};
    const rows = LISTS.filter(l => shown.includes(l.id) && cs[l.id]);
    if (rows.length){
      html += '<div style="margin-top:10px">';
      for (const l of rows){
        const pct = Math.round((cs[l.id] / l.count) * 100);
        html += '<div class="brow" style="grid-template-columns:1fr 62px"><div><div class="bname">' + esc(l.name) + '</div>' +
                '<i class="bbar"><s style="width:' + Math.max(1,pct) + '%"></s></i></div>' +
                '<div class="bcount">' + cs[l.id] + '/' + l.count + '</div></div>';
      }
      html += '</div>';
    }
    html += '</article>';
  });
  return html + '</div>';
}

state = loadLocal();
if (!state.enabled || !state.enabled.length) state.enabled = ['wainwright','hewitt-wales'];
saveLocal();   // persist the migration immediately, so it happens once
if (!state.enabled.includes(ui.list)) ui.list = state.enabled[0];
render();
if (backend === 'github') initSync(); else { cloudReady = true; }
fbStart();

</script>
