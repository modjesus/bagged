<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bagged</title>
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bagged">
<meta name="application-name" content="Bagged">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E8EAE3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131714" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">

<style>
:root{
  --ground:#E8EAE3; --surface:#F7F8F3; --surface-2:#DDE1D7; --raise:#FFFFFF;
  --ink:#1A1F1B; --ink-2:#5C6459; --ink-3:#868D80;
  --line:#C8CEC0; --line-soft:#D8DCD0;
  --accent:#6B4FA0; --accent-ink:#FFFFFF; --accent-soft:#EBE4F7;
  --done:#3C7852; --done-soft:#DCEBE0; --done-line:#A9CDB6;
  --warn:#9A5B2A;
  --shadow:0 1px 2px rgba(26,31,27,.06), 0 6px 20px -12px rgba(26,31,27,.28);
  --r:14px;
  /* Wainwright first-edition binding colours */
  --bk1:#2F5D3A; --bk2:#6E7472; --bk3:#4A7A9B; --bk4:#A8511F;
  --bk5:#7B2D34; --bk6:#8F6E1A; --bk7:#5F8244;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#131714; --surface:#1B201C; --surface-2:#262C27; --raise:#20261F;
    --ink:#E8EBE3; --ink-2:#9BA394; --ink-3:#79806F;
    --line:#333A33; --line-soft:#2A312B;
    --accent:#B79EEC; --accent-ink:#1B1230; --accent-soft:#2B2440;
    --done:#74B98D; --done-soft:#1E2E24; --done-line:#33513E;
    --warn:#D89A63;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.7);
    --bk1:#4E8C5E; --bk2:#8B928F; --bk3:#6FA3C4; --bk4:#C5652A;
    --bk5:#B8535B; --bk6:#E0B93C; --bk7:#7BA05B;
  }
}
:root[data-theme="dark"]{
  --ground:#131714; --surface:#1B201C; --surface-2:#262C27; --raise:#20261F;
  --ink:#E8EBE3; --ink-2:#9BA394; --ink-3:#79806F;
  --line:#333A33; --line-soft:#2A312B;
  --accent:#B79EEC; --accent-ink:#1B1230; --accent-soft:#2B2440;
  --done:#74B98D; --done-soft:#1E2E24; --done-line:#33513E;
  --warn:#D89A63;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.7);
  --bk1:#4E8C5E; --bk2:#8B928F; --bk3:#6FA3C4; --bk4:#C5652A;
  --bk5:#B8535B; --bk6:#E0B93C; --bk7:#7BA05B;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  font-size:16px; line-height:1.45; -webkit-text-size-adjust:100%; padding-bottom:64px;
}
button, input, textarea, select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
img{max-width:100%}
.wrap{max-width:680px; margin:0 auto; padding:0 14px}

/* header */
.top{
  position:sticky; top:0; z-index:900;
  padding-top:env(safe-area-inset-top, 0px);
  background:color-mix(in srgb, var(--ground) 90%, transparent);
  backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--line-soft);
}
.brandrow{display:flex; align-items:center; gap:8px; padding:12px 0 8px}
.brand{font-family:"Bricolage Grotesque",sans-serif; font-weight:800; font-size:26px; letter-spacing:-.02em; line-height:1; margin:0; flex:none}
.brand em{font-style:normal; color:var(--accent)}
.sync{
  margin-left:auto; display:inline-flex; align-items:center; gap:6px;
  background:var(--surface); border:1px solid var(--line); border-radius:99px;
  padding:5px 11px; font-size:12px; color:var(--ink-2); white-space:nowrap;
  font-family:"IBM Plex Mono",monospace;
}
.sync .dot{width:7px; height:7px; border-radius:99px; background:var(--ink-3); flex:none}
.sync[data-s="synced"] .dot{background:var(--done)}
.sync[data-s="saving"] .dot{background:var(--accent); animation:pulse 1s ease-in-out infinite}
.sync[data-s="pending"] .dot, .sync[data-s="error"] .dot, .sync[data-s="local"] .dot{background:var(--warn)}
.sync[data-s="pending"], .sync[data-s="error"], .sync[data-s="local"]{border-color:var(--warn); color:var(--warn)}
@keyframes pulse{50%{opacity:.3}}
.iconbtn{background:none; border:1px solid var(--line); border-radius:10px; width:34px; height:30px; display:grid; place-items:center; color:var(--ink-2); flex:none}
.tabs{display:flex; gap:4px; padding-bottom:10px}
.tab{
  flex:1; background:transparent; border:1px solid transparent; border-radius:10px;
  padding:8px 4px 9px; color:var(--ink-2); font-weight:500; font-size:14px;
  display:flex; flex-direction:column; align-items:center; gap:2px; line-height:1.1;
}
.tab .n{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{background:var(--surface); border-color:var(--line); color:var(--ink); box-shadow:var(--shadow)}
.tab[aria-selected="true"] .n{color:var(--accent)}

/* list picker */
.listbar{display:flex; gap:6px; overflow-x:auto; padding:14px 0 2px; scrollbar-width:none}
.listbar::-webkit-scrollbar{display:none}
.lchip{
  flex:none; border:1px solid var(--line); background:var(--surface); border-radius:99px;
  padding:7px 13px; font-size:13.5px; color:var(--ink-2); white-space:nowrap;
  display:inline-flex; align-items:center; gap:7px;
}
.lchip b{font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:600; color:var(--ink-3); font-variant-numeric:tabular-nums}
.lchip[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
.lchip[aria-pressed="true"] b{color:var(--accent)}
:root[data-theme="dark"] .lchip[aria-pressed="true"], :root:not([data-theme="light"]) .lchip[aria-pressed="true"]{color:var(--ink)}
:root[data-theme="dark"] .lchip[aria-pressed="true"] b, :root:not([data-theme="light"]) .lchip[aria-pressed="true"] b{color:var(--ink-2)}
.lchip.add{border-style:dashed; color:var(--ink-3)}

/* progress */
.summary{padding:14px 0 4px}
.sumhead{display:flex; align-items:flex-end; justify-content:space-between; gap:12px}
.bignum{font-family:"Bricolage Grotesque",sans-serif; font-weight:700; font-size:40px; line-height:.9; letter-spacing:-.03em; font-variant-numeric:tabular-nums}
.bignum span{font-size:20px; color:var(--ink-3); font-weight:500}
.sumlabel{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); text-align:right}
.bar{height:8px; background:var(--surface-2); border-radius:99px; overflow:hidden; margin-top:12px}
.bar > i{display:block; height:100%; background:var(--done); border-radius:99px; transition:width .35s ease}
.meta{display:flex; gap:14px; flex-wrap:wrap; margin-top:8px; font-size:13px; color:var(--ink-2)}
.meta b{font-family:"IBM Plex Mono",monospace; font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums}
.disclose{margin-top:10px; width:100%; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:10px 12px; font-size:13px; color:var(--ink-2); display:flex; align-items:center; justify-content:space-between; gap:8px}
.breakdown{border:1px solid var(--line); border-top:none; border-radius:0 0 var(--r) var(--r); background:var(--surface); padding:4px 12px 12px; margin-top:-1px}
.brow{display:grid; grid-template-columns:1fr 52px; gap:10px; align-items:center; padding:7px 0; border-top:1px solid var(--line-soft)}
.brow:first-child{border-top:none}
.bname{font-size:13px; display:flex; align-items:center; gap:7px}
.bbar{display:block; height:5px; border-radius:99px; background:var(--surface-2); margin-top:5px; overflow:hidden}
.bbar > s{display:block; height:100%; background:var(--done); border-radius:99px}
.bcount{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-2); text-align:right; font-variant-numeric:tabular-nums}

/* controls */
.controls{display:flex; flex-direction:column; gap:8px; margin:16px 0 10px}
.field{flex:1; display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:0 12px}
.field input{flex:1; border:none; background:none; padding:11px 0; outline:none; min-width:0}
.field svg{flex:none; color:var(--ink-3)}
.seg{display:flex; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:3px; gap:2px}
.seg button{border:none; background:none; border-radius:10px; padding:7px 11px; font-size:13px; color:var(--ink-2); font-weight:500; white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.chips{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none;
  -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent);
  mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none; border:1px solid var(--line); background:var(--surface); border-radius:99px; padding:6px 12px; font-size:13px; color:var(--ink-2); white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
:root[data-theme="dark"] .chip[aria-pressed="true"], :root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:var(--ink)}

/* list */
.grouphead{position:sticky; top:var(--topH,104px); z-index:5; padding:16px 2px 6px; background:linear-gradient(var(--ground) 70%, transparent)}
.gt{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
.grouphead h2{margin:0; font-family:"Bricolage Grotesque",sans-serif; font-weight:700; font-size:15px; letter-spacing:-.01em; display:flex; align-items:center; gap:8px}
.grouphead span{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums; white-space:nowrap}
.gbar{display:block; height:4px; border-radius:99px; background:var(--surface-2); margin-top:6px; overflow:hidden}
.gbar > i{display:block; height:100%; background:var(--done); border-radius:99px; transition:width .3s ease}
.swatch{width:10px; height:10px; border-radius:3px; flex:none; display:inline-block}

ul.hills{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px}
li.hill{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; position:relative}
li.hill.on{background:var(--done-soft); border-color:var(--done-line)}
li.hill.bk::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--bkc)}
li.hill.bk .hrow{padding-left:14px}
.hrow{display:flex; align-items:center; gap:10px; padding:9px 12px 9px 10px}
.tick{flex:none; width:32px; height:32px; border-radius:99px; border:2px solid var(--line); background:var(--raise); display:grid; place-items:center; color:transparent; padding:0; transition:background .16s, border-color .16s, transform .16s}
li.hill.on .tick{background:var(--done); border-color:var(--done); color:#fff}
.tick:active{transform:scale(.88)}
.hmain{flex:1; min-width:0; background:none; border:none; padding:2px 0; text-align:left}
.hname{font-weight:500; font-size:15px; line-height:1.25; display:block}
.hsub{font-size:12px; color:var(--ink-3); display:block; margin-top:1px}
.hsub .wel{font-style:italic}
.thumb{flex:none; width:34px; height:34px; border-radius:8px; object-fit:cover; background:var(--surface-2); border:1px solid var(--line)}
.thumb.sm{width:26px; height:26px; border-radius:6px}
.popshot{width:100%; height:96px; object-fit:cover; border-radius:8px; display:block; margin-bottom:8px; background:var(--surface-2)}
.hh{font-family:"IBM Plex Mono",monospace; font-size:12px; font-variant-numeric:tabular-nums; color:var(--ink-2); flex:none; text-align:right; line-height:1.3}
.hh b{font-weight:600; color:var(--ink)}
.hh s{text-decoration:none; color:var(--ink-3); font-size:10.5px; display:block}
.tags{display:flex; gap:3px; flex-wrap:wrap; margin-top:3px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:9px; letter-spacing:.04em; border:1px solid var(--line); color:var(--ink-3); border-radius:4px; padding:1px 4px}

.detail{border-top:1px solid var(--line-soft); padding:10px 12px 12px; display:flex; flex-direction:column; gap:10px}
.detail label, .form label{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); display:block; margin-bottom:4px}
.detail textarea, .form input, .form textarea{width:100%; background:var(--raise); border:1px solid var(--line); border-radius:10px; padding:9px 10px; outline:none; font-size:15px}
.detail textarea, .form textarea{resize:vertical; min-height:56px}
.form .field input{border:none; background:none; padding:11px 0}
.detail textarea:focus, .form input:focus, .form textarea:focus{border-color:var(--accent)}
.dategroup{display:flex; gap:6px; align-items:stretch}
.dsel{background:var(--raise); border:1px solid var(--line); border-radius:10px; padding:9px 6px 9px 9px; font-size:15px; outline:none; min-width:0}
.dsel:focus{border-color:var(--accent)}
.dsel.dd{flex:0 1 78px} .dsel.dm{flex:1 1 96px} .dsel.dy{flex:0 1 92px}
.dtoday{flex:none; padding:9px 12px; white-space:nowrap}
.dhint{font-size:12px; color:var(--ink-3); margin:2px 0 0}
.linkbtn{background:none; border:none; color:var(--accent); font-size:13px; padding:9px 0; text-decoration:underline; text-underline-offset:3px}

/* photos */
.shots{display:flex; gap:6px; flex-wrap:wrap}
.shot{width:76px; height:76px; padding:0; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--surface-2); position:relative; flex:none}
.shot img{width:100%; height:100%; object-fit:cover; display:block}
.shot.up0::after{content:""; position:absolute; right:5px; bottom:5px; width:7px; height:7px; border-radius:99px; background:var(--warn); box-shadow:0 0 0 2px var(--surface)}
.addshot{width:76px; height:76px; border:1px dashed var(--line); border-radius:10px; display:grid; place-items:center; color:var(--ink-3); font-size:11px; cursor:pointer; text-align:center; flex:none;
  margin:0 !important; letter-spacing:0 !important; text-transform:none !important; font-family:inherit !important}
.viewer{position:fixed; inset:0; z-index:2000; background:rgba(8,11,9,.94); display:none; flex-direction:column}
.viewer.open{display:flex}
.viewer .vimg{flex:1; display:grid; place-items:center; padding:14px; min-height:0}
.viewer .vimg img{max-width:100%; max-height:100%; object-fit:contain; border-radius:8px}
.viewer .vbar{display:flex; gap:8px; padding:12px 14px calc(12px + env(safe-area-inset-bottom)); justify-content:space-between}
.viewer .vbar .cap{color:#D8DCD0; font-size:13px; align-self:center; flex:1; min-width:0}

/* map */
#mapbox{height:min(66vh,540px); border-radius:var(--r); overflow:hidden; border:1px solid var(--line); background:var(--surface-2); margin-top:10px}
.leaflet-container{background:var(--surface-2); font:inherit}
.leaflet-popup-content-wrapper{border-radius:12px; background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}
.leaflet-popup-tip{background:var(--surface)}
.leaflet-popup-content{margin:11px 13px; font-size:14px}
.leaflet-popup-content b{font-size:15px; display:block}
.leaflet-popup-content .pm{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); display:block; margin:2px 0 8px}
.popbtn{border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink); border-radius:9px; padding:7px 11px; font-weight:600; font-size:13px; width:100%}
.popbtn.off{background:transparent; color:var(--accent)}
.maplegend{display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; font-size:12px; color:var(--ink-3); align-items:center}
.maplegend i{width:11px; height:11px; border-radius:99px; display:inline-block; vertical-align:-1px; margin-right:5px; border:1.5px solid var(--ink-3); background:transparent}
.maplegend i.done{background:var(--done); border-color:var(--done)}
.mapnote{font-size:13px; color:var(--ink-3); margin:10px 0 0}

/* banners / plans / sheet */
.banner{display:flex; gap:10px; align-items:flex-start; margin-top:14px; background:var(--surface); border:1px solid var(--warn); border-left-width:4px; border-radius:var(--r); padding:11px 13px; font-size:13.5px; color:var(--ink-2); line-height:1.45}
.banner b{color:var(--warn); display:block; margin-bottom:2px}
.banner button{flex:none; background:none; border:none; color:var(--ink-3); font-size:18px; line-height:1; padding:0 2px; align-self:center}
.empty{text-align:center; color:var(--ink-3); padding:40px 20px; font-size:14px}
.planintro{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px; margin-top:16px; font-size:14px; color:var(--ink-2); line-height:1.5}
.btn{border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink); border-radius:11px; padding:10px 14px; font-weight:600; font-size:14px}
.btn.ghost{background:transparent; color:var(--accent)}
.btn.quiet{background:transparent; border-color:var(--line); color:var(--ink-2); font-weight:500}
.btn.danger{background:transparent; border-color:var(--warn); color:var(--warn)}
.btnrow{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; align-items:center}
.form{background:var(--surface); border:1px solid var(--accent); border-radius:var(--r); padding:14px; margin-top:12px; display:flex; flex-direction:column; gap:10px}
.picked{display:flex; flex-wrap:wrap; gap:6px}
.pill{display:inline-flex; align-items:center; gap:6px; background:var(--accent-soft); border:1px solid var(--accent); color:var(--accent); border-radius:99px; padding:4px 6px 4px 10px; font-size:13px}
:root[data-theme="dark"] .pill, :root:not([data-theme="light"]) .pill{color:var(--ink)}
.pill button{border:none; background:none; color:inherit; font-size:15px; line-height:1; padding:0 2px}
.results{display:flex; flex-direction:column; gap:4px; max-height:210px; overflow-y:auto}
.results button{text-align:left; background:var(--raise); border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:14px; display:flex; justify-content:space-between; gap:10px}
.results button span{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-3)}
.plan{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px; margin-top:10px}
.plan.done{border-color:var(--done-line); background:var(--done-soft)}
.planhead{display:flex; align-items:flex-start; gap:10px}
.plan h3{margin:0; font-family:"Bricolage Grotesque",sans-serif; font-size:18px; letter-spacing:-.01em; flex:1}
.planmeta{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3); letter-spacing:.04em; margin-top:3px; display:flex; gap:10px; flex-wrap:wrap}
.plannotes{font-size:14px; color:var(--ink-2); margin:10px 0 0; white-space:pre-wrap}
.planhills{list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:4px}
.planhills li{display:flex; align-items:center; gap:9px; font-size:14px; padding:3px 0}
.planhills .tick{width:24px; height:24px}
.planhills .tick svg{width:12px; height:12px}
.planhills .nm{flex:1; min-width:0}
.planhills li.on .tick{background:var(--done); border-color:var(--done); color:#fff}
.planhills .on .nm{color:var(--ink-2); text-decoration:line-through; text-decoration-color:var(--done)}
.planstat{height:6px; background:var(--surface-2); border-radius:99px; overflow:hidden; margin-top:12px}
.planstat > i{display:block; height:100%; background:var(--done); border-radius:99px}

.sheet{position:fixed; inset:0; z-index:2100; display:none; background:rgba(10,14,11,.55); padding:16px; overflow-y:auto}
.sheet.open{display:block}
.sheetbox{max-width:560px; margin:30px auto; background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:18px; box-shadow:var(--shadow)}
.sheetbox h2{font-family:"Bricolage Grotesque",sans-serif; margin:0 0 4px; font-size:20px}
.sheetbox h3{font-family:"Bricolage Grotesque",sans-serif; margin:20px 0 4px; font-size:15px}
.sheetbox p{font-size:14px; color:var(--ink-2); margin:6px 0}
.sheetbox textarea{width:100%; min-height:100px; background:var(--raise); border:1px solid var(--line); border-radius:10px; padding:10px; font-family:"IBM Plex Mono",monospace; font-size:12px; outline:none; resize:vertical}
.togglerow{display:flex; align-items:center; gap:11px; padding:10px 0; border-top:1px solid var(--line-soft)}
.togglerow:first-child{border-top:none}
.togglerow .tinfo{flex:1; min-width:0}
.togglerow .tinfo b{display:block; font-weight:600; font-size:15px}
.togglerow .tinfo span{font-size:12.5px; color:var(--ink-3)}
.sw{flex:none; width:46px; height:27px; border-radius:99px; border:1px solid var(--line); background:var(--surface-2); position:relative; padding:0; transition:background .18s, border-color .18s}
.sw::after{content:""; position:absolute; top:2px; left:2px; width:21px; height:21px; border-radius:99px; background:var(--raise); box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .18s}
.sw[aria-pressed="true"]{background:var(--done); border-color:var(--done)}
.sw[aria-pressed="true"]::after{transform:translateX(19px)}

.toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(10px); background:var(--ink); color:var(--ground); padding:10px 16px; border-radius:99px; font-size:14px; z-index:2200; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; box-shadow:var(--shadow); max-width:90vw; text-align:center}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }
</style>
</head>
