# Rebuilds the places files (pubs, car parks, toilets and so on near the hills)
# from OpenStreetMap once a week, and whenever you press "Run workflow".
name: places
on:
  schedule:
    - cron: '20 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/places.js
      - name: commit
        run: |
          git config user.name "waymark-bot"
          git config user.email "bot@waymark.it.com"
          git add places
          git diff --cached --quiet || git commit -m "places: weekly refresh from OpenStreetMap"
          git push
