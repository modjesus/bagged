<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camp Supplies — WayMark</title>
<meta name="description" content="Twenty-two tee designs, none of them made yet. Tell us which ones you would actually wear.">
<link rel="canonical" href="https://waymark.it.com/supplies">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">

<!-- What a shared link looks like when it lands in a message. The picture is a
     real tee rather than the app's own card: somebody is being sent shirts. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="WayMark">
<meta property="og:title" content="Which of these should we actually print?">
<meta property="og:description" content="Twenty-two tee designs, none of them made yet. Say yes or no to the ones you would wear — the counts are live.">
<meta property="og:url" content="https://waymark.it.com/supplies">
<meta property="og:image" content="https://waymark.it.com/tees/14-back-lg.png">
<meta name="twitter:card" content="summary_large_image">

<!-- GitHub Pages has no server to rewrite a path, so this file is the door.
     It hands the app the same thing in the hash; the app puts the tidy address
     back the moment it boots, so what somebody copies out of the bar afterwards
     is still /supplies. Nothing below renders unless scripting is off. -->
<script>location.replace('/#supplies');</script>

<style>
:root{--ground:#EEE9DD; --surface:#F8F5EC; --ink:#14332D; --ink-2:#3E625A; --line:#CFC9B8; --accent:#B4491A; --accent-text:#A8431A}
@media (prefers-color-scheme:dark){ :root{--ground:#0C221D; --surface:#14332D; --ink:#F3EFE6; --ink-2:#A3BEB8; --line:#2A5A51; --accent-text:#E8925F} }
*{box-sizing:border-box}
body{margin:0; min-height:100dvh; display:grid; place-items:center; background:var(--ground); color:var(--ink); font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif; font-size:17px; line-height:1.5; padding:24px}
.sheet{max-width:420px; width:100%; background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:26px 24px 22px}
h1{font-size:26px; line-height:1.15; margin:0 0 10px; text-wrap:balance}
p{margin:0 0 18px; color:var(--ink-2)}
a.btn{display:inline-block; background:var(--accent); color:#F6EFE4; text-decoration:none; font-weight:600; padding:10px 16px; border-radius:9px; border:1px solid var(--accent)}
</style>
</head>
<body>
<main class="sheet">
  <h1>Camp Supplies</h1>
  <p>Twenty-two tee designs, none of them made yet. This page needs JavaScript to show them.</p>
  <a class="btn" href="/#supplies">Open WayMark</a>
</main>
</body>
</html>
